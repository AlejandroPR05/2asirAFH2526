<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Gemma Fine-Tuned</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background-color: #252526;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .header {
            background-color: #333;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #444;
            font-weight: bold;
        }
        .status {
            font-size: 0.8em;
            color: #888;
        }
        .status.online { color: #4caf50; }
        .status.offline { color: #f44336; }

        #chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 10px;
            line-height: 1.5;
        }
        .user-message {
            align-self: flex-end;
            background-color: #007acc;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #3e3e42;
            color: #d4d4d4;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            padding: 20px;
            background-color: #333;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: #1e1e1e;
            color: white;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #1177bb; }
        button:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        Gemma Fine-Tuned (Agente Formal)
        <div id="connection-status" class="status offline">Desconectado (Esperando servidor...)</div>
    </div>
    
    <div id="chat-history">
        <div class="message bot-message">
            Bienvenido. Soy su asistente virtual entrenado. ¿En qué puedo ayudarle hoy?
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Escriba su mensaje aquí..." onkeypress="handleEnter(event)">
        <button id="send-btn" onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    // URL del servidor local de LM Studio (por defecto)
    const API_URL = "http://localhost:1234/v1/chat/completions";

    // Verificar conexión cada 5 segundos
    setInterval(checkConnection, 5000);
    checkConnection();

    async function checkConnection() {
        try {
            const response = await fetch("http://localhost:1234/v1/models");
            if(response.ok) {
                document.getElementById('connection-status').innerText = "🟢 Conectado a LM Studio";
                document.getElementById('connection-status').className = "status online";
            }
        } catch (e) {
            document.getElementById('connection-status').innerText = "🔴 Desconectado (Inicia el servidor en LM Studio)";
            document.getElementById('connection-status').className = "status offline";
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const text = inputField.value.trim();
        
        if (!text) return;

        // 1. Mostrar mensaje del usuario
        addMessage(text, 'user-message');
        inputField.value = '';
        inputField.disabled = true;
        sendBtn.disabled = true;

        // 2. Preparar el historial (simplificado)
        const payload = {
            messages: [
                { role: "system", content: "Eres un asistente útil y formal." },
                { role: "user", content: text }
            ],
            temperature: 0.7,
            max_tokens: -1,
            stream: false
        };

        try {
            // 3. Enviar a LM Studio
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            // 4. Mostrar respuesta
            if (data.choices && data.choices.length > 0) {
                addMessage(data.choices[0].message.content, 'bot-message');
            } else {
                addMessage("Error: No se recibió respuesta.", 'bot-message');
            }

        } catch (error) {
            addMessage("Error de conexión. Asegúrate de iniciar 'Local Server' en LM Studio.", 'bot-message');
            console.error(error);
        }

        inputField.disabled = false;
        sendBtn.disabled = false;
        inputField.focus();
    }

    function addMessage(text, className) {
        const history = document.getElementById('chat-history');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        history.appendChild(msgDiv);
        history.scrollTop = history.scrollHeight;
    }
</script>

</body>
</html>
